<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290">
  <!-- Hesperornis regalis lunging at a small fish, neck drawn back in an S to strike,
       near foot powering back. Original drawing for this site. Light from the upper left. -->
  <defs>
    <linearGradient id="he-body" x1="0" y1="86" x2="0" y2="166" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36424d"/>
      <stop offset=".4" stop-color="#4a5762"/>
      <stop offset=".58" stop-color="#6c7983"/>
      <stop offset=".74" stop-color="#cfd6d3"/>
      <stop offset="1" stop-color="#b9c1bd"/>
    </linearGradient>
    <linearGradient id="he-beak" x1="0" y1="66" x2="0" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a98734"/>
      <stop offset=".45" stop-color="#e2c66e"/>
      <stop offset="1" stop-color="#c9a852"/>
    </linearGradient>
    <linearGradient id="he-foot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6623f"/>
      <stop offset="1" stop-color="#6c3b26"/>
    </linearGradient>
    <linearGradient id="he-foot-far" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76493a"/>
      <stop offset="1" stop-color="#523429"/>
    </linearGradient>
    <linearGradient id="he-leg" x1="150" y1="0" x2="90" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b6a58"/>
      <stop offset="1" stop-color="#8a4c32"/>
    </linearGradient>
    <linearGradient id="he-fish" x1="0" y1="124" x2="0" y2="156" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f6f78"/>
      <stop offset=".45" stop-color="#9fb9bd"/>
      <stop offset=".7" stop-color="#e3ece8"/>
      <stop offset="1" stop-color="#c3d0cd"/>
    </linearGradient>
    <radialGradient id="he-eye" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#f08a5a"/>
      <stop offset=".55" stop-color="#a8301e"/>
      <stop offset="1" stop-color="#3a0e08"/>
    </radialGradient>
    <!-- Overlapping feather tips -->
    <pattern id="he-feathers" width="10" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <path d="M0,3 Q2.5,6.5 5,3 M5,7 Q7.5,10.5 10,7 M-5,7 Q-2.5,10.5 0,7" fill="none" stroke="#c9d2d6" stroke-width=".7"/>
    </pattern>
    <filter id="he-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 .05  0 0 0 0 .08  0 0 0 0 .1  0 0 0 .6 -.2"/>
    </filter>
    <filter id="he-soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="he-softer" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>

    <path id="he-outline" d="M552.0,104.0 C548.3,103.3 537.7,102.0 530.0,100.0 C522.3,98.0 514.3,94.3 506.0,92.0 C497.7,89.7 488.3,87.7 480.0,86.0 C471.7,84.3 464.0,84.3 456.0,82.0 C448.0,79.7 439.7,75.8 432.0,72.0 C424.3,68.2 415.9,59.7 409.8,59.1 C403.7,58.5 397.4,65.5 395.4,68.1 C393.4,70.8 396.7,72.7 397.6,75.1 C398.4,77.5 399.6,79.7 400.6,82.5 C401.7,85.4 403.1,88.7 403.9,92.2 C404.8,95.8 405.5,99.0 405.8,103.8 C406.0,108.7 406.5,115.7 405.4,121.4 C404.3,127.2 402.1,133.3 399.1,138.3 C396.1,143.4 391.9,148.0 387.3,151.7 C382.8,155.5 377.4,158.4 371.8,160.7 C366.2,163.1 362.5,163.8 353.8,165.6 C345.2,167.5 330.6,169.9 320.0,172.0 C309.4,174.1 301.0,177.0 290.0,178.0 C279.0,179.0 268.0,180.3 254.0,178.0 C240.0,175.7 222.3,169.3 206.0,164.0 C189.7,158.7 169.3,151.7 156.0,146.0 C142.7,140.3 134.0,134.7 126.0,130.0 C118.0,125.3 112.0,122.0 108.0,118.0 C104.0,114.0 100.3,109.7 102.0,106.0 C103.7,102.3 111.3,98.7 118.0,96.0 C124.7,93.3 132.3,91.3 142.0,90.0 C151.7,88.7 163.0,87.7 176.0,88.0 C189.0,88.3 205.7,89.7 220.0,92.0 C234.3,94.3 249.0,98.0 262.0,102.0 C275.0,106.0 287.7,112.5 298.0,116.0 C308.3,119.5 317.0,121.4 323.7,123.2 C330.3,125.1 333.4,126.3 337.9,127.2 C342.3,128.1 346.6,128.5 350.4,128.6 C354.2,128.7 357.7,128.3 360.7,127.8 C363.7,127.2 366.2,126.3 368.3,125.2 C370.5,124.2 372.1,123.0 373.6,121.3 C375.0,119.7 376.3,118.1 377.1,115.2 C377.8,112.4 378.0,107.1 378.2,104.2 C378.4,101.2 378.3,99.6 378.0,97.4 C377.7,95.1 377.1,92.9 376.4,90.5 C375.8,88.1 374.8,85.7 374.0,83.0 C373.2,80.3 372.1,77.6 371.7,74.3 C371.3,71.1 370.8,67.3 371.6,63.6 C372.4,60.0 374.1,55.8 376.4,52.5 C378.8,49.2 382.2,46.3 385.8,43.7 C389.4,41.1 392.5,38.2 398.2,36.9 C403.9,35.6 413.4,37.0 420.0,36.0 C426.6,35.0 432.0,31.3 438.0,31.0 C444.0,30.7 451.3,32.8 456.0,34.0 C460.7,35.2 463.0,36.0 466.0,38.0 C469.0,40.0 469.7,42.3 474.0,46.0 C478.3,49.7 485.3,55.3 492.0,60.0 C498.7,64.7 507.0,69.0 514.0,74.0 C521.0,79.0 527.7,85.0 534.0,90.0 C540.3,95.0 549.0,101.7 552.0,104.0 Z"/>
    <clipPath id="he-clip"><use href="#he-outline"/></clipPath>
  </defs>

  <g transform="translate(-4 4) scale(1.08)">
    <!-- Bubbles streaming off the back and the kicking feet -->
    <g fill="#d9f1f2" fill-opacity=".18" stroke="#8fc3cb" stroke-width="1.3">
      <circle cx="70" cy="122" r="4"/><circle cx="58" cy="104" r="2.8"/><circle cx="66" cy="86" r="3.4"/>
      <circle cx="52" cy="70" r="2.2"/><circle cx="150" cy="78" r="2.6"/><circle cx="168" cy="62" r="3.2"/><circle cx="160" cy="44" r="2"/>
      <circle cx="574" cy="96" r="2.2"/><circle cx="582" cy="84" r="1.6"/>
    </g>
    <g fill="#fff" opacity=".85">
      <circle cx="68.6" cy="120.4" r="1.2"/><circle cx="64.8" cy="84.6" r="1"/><circle cx="166.8" cy="60.8" r=".9"/>
    </g>

    <!-- Small fish darting away -->
    <g transform="translate(-30 -6)">
      <path d="M598,140 C612,128 636,124 656,130 C664,132 670,136 674,140 C668,145 660,149 650,151 C630,155 610,150 598,140 Z" fill="url(#he-fish)" stroke="#16242a" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M600,140 L582,128 C586,136 586,144 582,152 Z" fill="#7d979c" stroke="#16242a" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M626,128 C632,120 642,118 648,120 C644,124 640,126 636,128 Z" fill="#6a868c" stroke="#16242a" stroke-width="1"/>
      <path d="M632,148 C634,154 640,156 646,156 C644,152 642,150 640,149 Z" fill="#9db3b6" stroke="#16242a" stroke-width=".9"/>
      <path d="M604,141 C624,140 646,139 668,139" fill="none" stroke="#f3f7f4" stroke-width="1.6" opacity=".7"/>
      <path d="M652,132 C654,138 654,144 651,150" fill="none" stroke="#2e444b" stroke-width="1" opacity=".6"/>
      <circle cx="662" cy="137" r="2.6" fill="#f2efe0" stroke="#16242a" stroke-width=".8"/>
      <circle cx="662.4" cy="137" r="1.3" fill="#0b1214"/>
    </g>

    <!-- Short tail: a few stiff feather tips (further away, so a touch smaller) -->
    <g transform="translate(118 104) scale(.88) translate(-118 -104)" fill="#3f4b56" stroke="#141a1f" stroke-width="1.1" stroke-linejoin="round">
      <path d="M118,98 C104,96 92,96 78,98 C90,102 104,106 116,108 Z"/>
      <path d="M118,104 C104,106 90,110 78,116 C92,116 106,114 118,112 Z" fill="#56636d"/>
    </g>
    <path d="M114,100 C102,100 92,100 82,99" fill="none" stroke="#a9b7be" stroke-width=".8" opacity=".6"/>

    <!-- Far leg: recovery stroke, toes folded and lobes collapsed -->
    <g transform="translate(166 104) scale(.84) translate(-166 -104)">
    <path d="M170,100 C160,92 148,82 134,70 L120,80 C134,92 146,102 156,112 Z" fill="url(#he-foot-far)" stroke="#16100c" stroke-width="1.1" stroke-linejoin="round"/>
    <g fill="url(#he-foot-far)" stroke="#16100c" stroke-width="1.1" stroke-linejoin="round">
      <path d="M128.9,71.8 C128.8,68.9 113.0,62.5 110.6,65.3 C110.6,62.1 94.8,55.6 92.5,58.1 C92.4,55.2 76.6,48.7 74.5,50.9 L68.6,49.8 L73.4,53.4 C75.5,54.4 89.2,60.0 91.5,60.4 C93.4,62.0 107.1,67.5 109.5,67.9 C111.4,69.5 125.0,75.1 127.1,76.2 Z"/>
      <path d="M128.4,73.6 C127.7,70.9 110.7,67.9 108.9,71.2 C108.3,68.0 91.3,65.1 89.6,68.0 C88.9,65.2 71.8,62.3 70.2,64.8 L64.2,65.0 L69.7,67.5 C72.0,68.1 86.7,70.6 89.1,70.5 C91.3,71.6 106.0,74.1 108.4,74.0 C110.6,75.1 125.3,77.7 127.6,78.4 Z"/>
      <path d="M129.8,75.8 C128.6,73.6 112.7,74.8 111.9,78.0 C110.6,75.4 94.8,76.5 93.9,79.5 C92.7,77.2 76.8,78.3 75.9,80.9 L70.6,82.4 L76.1,83.3 C78.3,83.3 92.0,82.3 94.1,81.7 C96.3,82.2 110.0,81.2 112.1,80.5 C114.3,81.1 128.0,80.0 130.2,80.2 Z"/>
      <ellipse cx="128" cy="76" rx="5" ry="5.5"/>
    </g>
    </g>

    <!-- Near leg: set far back, the shank emerging from the belly feathers -->
    <path d="M164,124 C146,136 124,146 104,152 L100,170 C124,164 152,154 178,140 Z" fill="url(#he-leg)" stroke="#16100c" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Body, neck and head -->
    <use href="#he-outline" fill="url(#he-body)"/>
    <g clip-path="url(#he-clip)">
      <rect x="80" y="40" width="360" height="90" fill="url(#he-feathers)" opacity=".3"/>
      <rect x="-20" y="-30" width="720" height="320" filter="url(#he-grain)"/>
      <!-- pale throat and fore-neck -->
      <path d="M409.8,59.1 C407.4,60.6 397.4,65.5 395.4,68.1 C393.4,70.8 396.7,72.7 397.6,75.1 C398.4,77.5 399.6,79.7 400.6,82.5 C401.7,85.4 403.1,88.7 403.9,92.2 C404.8,95.8 405.5,99.0 405.8,103.8 C406.0,108.7 406.5,115.7 405.4,121.4 C404.3,127.2 402.1,133.3 399.1,138.3 C396.1,143.4 391.9,148.0 387.3,151.7 C382.8,155.5 377.4,158.4 371.8,160.7 C366.2,163.1 365.8,165.8 353.8,165.6 C341.9,165.5 309.0,160.9 300.0,160.0" fill="none" stroke="#e6eae5" stroke-width="16" opacity=".9" filter="url(#he-soft)"/>
      <!-- beak -->
      <path d="M478,36 C510,58 540,84 570,104 L570,120 L474,94 C470,76 470,56 478,36 Z" fill="url(#he-beak)"/>
      <!-- top plane of the beak, turned toward us -->
      <path d="M476,46 C502,60 528,80 552,104 C528,88 504,76 478,66 Z" fill="#f1dc98" opacity=".6"/>
      <path d="M534,92 L570,104 L570,120 L530,104 Z" fill="#6e5a2c" opacity=".35"/>
      <!-- pale chin and throat facing the viewer -->
      <ellipse cx="448" cy="76" rx="18" ry="8" fill="#e9ece7" opacity=".75" filter="url(#he-soft)"/>
      <!-- dark cap -->
      <path d="M468,44 C452,34 436,32 420,36 C406,44 396,54 386,68" fill="none" stroke="#28323a" stroke-width="9" opacity=".5" filter="url(#he-soft)"/>
      <!-- barring across the back -->
      <g fill="none" stroke="#273038" stroke-width="1.4" opacity=".45">
        <path d="M284,110 c-4,6 -6,12 -6,18"/><path d="M268,106 c-4,6 -6,13 -6,20"/><path d="M252,102 c-4,7 -6,14 -6,22"/>
        <path d="M236,99 c-4,7 -6,14 -6,23"/><path d="M220,97 c-4,7 -6,14 -6,23"/><path d="M204,95 c-4,7 -6,14 -6,23"/>
        <path d="M188,94 c-4,7 -6,14 -6,22"/><path d="M172,93 c-4,7 -6,13 -6,21"/><path d="M156,93 c-4,6 -6,12 -6,19"/>
        <path d="M140,95 c-4,6 -5,11 -5,17"/><path d="M124,97 c-3,5 -5,10 -5,14"/><path d="M300,116 c-3,5 -5,10 -5,15"/>
      </g>
      <!-- rounded breast catching light -->
      <ellipse cx="300" cy="160" rx="42" ry="14" fill="#f4f6f2" opacity=".55" filter="url(#he-soft)"/>
      <path d="M330,152 C360,150 380,136 392,112" fill="none" stroke="#f0f3ef" stroke-width="10" opacity=".45" filter="url(#he-soft)"/>
      <!-- sunlit ridge along crown, neck and back -->
      <path d="M466,50 C452,40 432,36 414,42 C396,50 384,64 382,82 C382,100 378,112 364,118 C340,120 300,108 250,98 C200,90 150,90 112,98" fill="none" stroke="#b7c9d2" stroke-width="6" opacity=".45" filter="url(#he-softer)"/>
      <!-- belly shadow -->
      <path d="M110,116 C150,140 200,160 260,168 C290,170 310,168 330,160" fill="none" stroke="#6b7774" stroke-width="10" opacity=".4" filter="url(#he-softer)"/>
      <!-- soft flank shading over the thigh -->
      <ellipse cx="170" cy="124" rx="44" ry="13" fill="#3b4752" opacity=".28" filter="url(#he-softer)"/>
    </g>
    <use href="#he-outline" fill="none" stroke="#141a1f" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Beak: gape line, tiny teeth, nostril -->
    <path d="M550,104 C530,96 506,88 486,82 C476,79 466,78 458,78" fill="none" stroke="#3a2c10" stroke-width="1.4" stroke-linecap="round"/>
    <g stroke="#f4efe0" stroke-width="1.2" stroke-linecap="round" opacity=".9">
      <path d="M538,99 l-1.2,2.4"/><path d="M528,95 l-1.2,2.6"/><path d="M518,91.5 l-1.2,2.6"/><path d="M508,88 l-1.2,2.6"/><path d="M498,85 l-1.2,2.4"/>
    </g>
    <path d="M478,66 C496,72 520,84 548,102" fill="none" stroke="#8a6a24" stroke-width="1" opacity=".6"/>
    <path d="M492,76 l8,3" stroke="#4a3a14" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
    <!-- eye -->
    <!-- far eye peeking past the top of the head -->
    <path d="M466,41 C470,39 474,40 477,43" fill="none" stroke="#141a1f" stroke-width="1.2" opacity=".7"/>
    <ellipse cx="472.5" cy="45.5" rx="2.2" ry="2.7" fill="url(#he-eye)" stroke="#0e1114" stroke-width=".9"/>
    <circle cx="473" cy="45.6" r="1" fill="#0a0c0e"/>
    <!-- near eye, sitting further forward -->
    <path d="M461,48 C455,44 447,44 442,48" fill="none" stroke="#141a1f" stroke-width="1.6" opacity=".7"/>
    <circle cx="452" cy="54" r="5" fill="url(#he-eye)" stroke="#0e1114" stroke-width="1.3"/>
    <circle cx="452" cy="54" r="2" fill="#0a0c0e"/>
    <circle cx="450.5" cy="52.5" r="1.2" fill="#fff" opacity=".9"/>

    <!-- Vestigial wing: a small feathered tuft -->
    <g stroke="#1a2228" stroke-width=".8" stroke-linejoin="round" fill="#4e5b65">
      <path d="M296,128 C282,128 266,132 250,138 C266,139 282,137 296,134 Z"/>
      <path d="M290,133 C278,134 266,138 254,143 C268,143 280,140 291,137 Z" fill="#5d6a73"/>
    </g>

    <!-- Near foot: power stroke, toes fanned wide with each lobe spread -->
    <g transform="translate(104 161) scale(1.14) translate(-104 -161)">
    <g fill="url(#he-foot)" stroke="#16100c" stroke-width="1.2" stroke-linejoin="round">
      <path d="M105.7,154.0 C107.0,147.1 86.5,138.3 81.7,145.5 C83.3,138.1 62.7,129.3 58.3,135.8 C59.5,129.1 38.9,120.3 34.9,126.0 L27.0,125.0 L32.9,130.5 C35.6,132.0 53.3,139.6 56.5,140.0 C58.8,142.3 76.5,149.9 79.7,150.2 C82.0,152.7 99.7,160.3 102.3,162.0 Z"/>
      <path d="M101.8,157.4 C99.8,150.2 77.0,151.4 75.9,160.5 C73.9,152.7 51.0,153.9 49.9,162.1 C48.0,155.3 25.1,156.4 23.9,163.7 L16.2,166.4 L24.1,168.8 C27.3,169.0 47.0,168.0 50.1,166.9 C53.3,168.1 73.1,167.1 76.1,165.9 C79.3,167.2 99.1,166.1 102.2,166.6 Z"/>
      <path d="M101.7,162.6 C96.9,158.0 80.5,169.1 83.9,176.6 C78.8,171.5 62.4,182.7 65.4,189.4 C60.8,185.1 44.3,196.2 46.9,202.3 L42.4,207.8 L49.4,206.1 C51.8,204.8 66.0,195.2 67.8,193.0 C70.7,192.5 84.9,182.8 86.6,180.6 C89.6,180.1 103.8,170.5 106.3,169.4 Z"/>
      <path d="M107.1,154.7 C108.6,152.4 95.1,140.9 92.7,143.2 L90.6,142.8 L91.3,144.8 C91.6,145.6 104.5,156.6 104.9,157.3 Z"/>
      <ellipse cx="104" cy="161" rx="6.5" ry="7"/>
    </g>
    <g fill="none" stroke="#d9a47f" stroke-width="1" opacity=".55">
      <path d="M100,156 L38,130"/><path d="M98,162 L28,166"/><path d="M102,166 L52,201"/>
    </g>
    </g>
  </g>
</svg>
